<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 52" width="220" height="52">
  <defs>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C3A"/>
      <stop offset="100%" style="stop-color:#F07818"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Phone icon -->
  <g transform="translate(4, 4)">
    <!-- Phone body -->
    <rect x="2" y="0" width="28" height="44" rx="5" ry="5" fill="url(#phoneGrad)"/>
    <!-- Screen -->
    <rect x="5" y="6" width="22" height="28" rx="2" ry="2" fill="#1a1a2e" opacity="0.85"/>
    <!-- Screen shine -->
    <rect x="5" y="6" width="10" height="28" rx="2" ry="2" fill="white" opacity="0.05"/>
    <!-- Speaker -->
    <rect x="11" y="2" width="10" height="2.5" rx="1.25" fill="white" opacity="0.4"/>
    <!-- Home button circle -->
    <circle cx="16" cy="39.5" r="3" fill="white" opacity="0.25"/>
    <circle cx="16" cy="39.5" r="1.5" fill="white" opacity="0.4"/>
    <!-- Screen content lines -->
    <rect x="8" y="12" width="16" height="2" rx="1" fill="#F07818" opacity="0.7"/>
    <rect x="8" y="17" width="12" height="1.5" rx="0.75" fill="white" opacity="0.25"/>
    <rect x="8" y="21" width="14" height="1.5" rx="0.75" fill="white" opacity="0.2"/>
    <rect x="8" y="25" width="10" height="1.5" rx="0.75" fill="white" opacity="0.2"/>
    <!-- Wrench repair icon on screen -->
    <circle cx="16" cy="21" r="6" fill="#F07818" opacity="0.15"/>
    <text x="16" y="24" font-family="Arial" font-size="8" fill="#FF8C3A" text-anchor="middle" opacity="0.9">🔧</text>
  </g>

  <!-- Text group -->
  <g transform="translate(42, 0)">
    <!-- REPARE-MOI -->
    <text x="0" y="28" 
          font-family="'Montserrat','Arial Black',sans-serif" 
          font-size="19" 
          font-weight="900" 
          fill="white" 
          letter-spacing="0.5">REPARE-MOI</text>
    <!-- CI accent -->
    <text x="145" y="28" 
          font-family="'Montserrat','Arial Black',sans-serif" 
          font-size="19" 
          font-weight="900" 
          fill="#F07818"
          letter-spacing="0.5"> CI</text>
    <!-- Tagline -->
    <text x="0" y="43" 
          font-family="'Open Sans',Arial,sans-serif" 
          font-size="10.5" 
          fill="#94a3b8" 
          letter-spacing="1.2"
          font-weight="400">Réparez sans vous ruiner !</text>
    <!-- Orange accent line under text -->
    <rect x="0" y="46" width="56" height="2" rx="1" fill="#F07818" opacity="0.6"/>
  </g>
</svg>
